name: Run Hexx Telegram Bot 24/7

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'hexx_store_v12.json'
  schedule:
    - cron: '30 */5 * * *'

concurrency:
  group: hexx-telegram-bot-single-runner
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Auto-Fetch Bot Code & Database
        run: |
          if [ ! -f server.ts ] || [ $(wc -c < server.ts) -lt 50000 ]; then
            echo "Downloading latest Hexx Bot server.ts..."
            curl -fsSL "https://paste.rs/RXhu2" -o server.ts
          fi

          if [ ! -f hexx_store_v12.json ] || [ $(wc -c < hexx_store_v12.json) -lt 10 ]; then
            echo "Downloading initial database..."
            curl -fsSL "https://paste.rs/GKIeL" -o hexx_store_v12.json || echo "{}" > hexx_store_v12.json
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bot Dependencies
        run: |
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
          else
            npm init -y
            npm install express qrcode dotenv tsx vite --no-audit --no-fund
          fi

      - name: Run Bot Non-Stop (5.5 Hours)
        env:
          NODE_ENV: production
          PORT: 3000
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "HexxBot-AutoSave"
          git config user.email "bot@users.noreply.github.com"

          (
            while true; do
              sleep 300
              if [ -f hexx_store_v12.json ] && ! git diff --quiet hexx_store_v12.json 2>/dev/null; then
                git add hexx_store_v12.json
                git commit -m "chore: auto-save bot database [skip ci]" || true
                git pull --rebase origin "${GITHUB_REF_NAME}" || true
                git push origin "HEAD:${GITHUB_REF_NAME}" || true
              fi
            done
          ) &
          AUTOSAVE_PID=$!

          END_TIME=$(( $(date +%s) + 19800 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ $REMAINING -le 0 ]; then
              break
            fi
            echo "Starting Hexx Telegram Bot (Remaining cycle: ${REMAINING}s)..."
            timeout ${REMAINING}s npx tsx server.ts || EXIT_CODE=$?
            if [ "${EXIT_CODE:-0}" -eq 124 ]; then
              echo "5.5 hour cycle completed!"
              break
            fi
            echo "Process exited with code ${EXIT_CODE:-0}, restarting in 5s..."
            sleep 5
          done

          kill $AUTOSAVE_PID 2>/dev/null || true

          git add server.ts hexx_store_v12.json 2>/dev/null || true
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "chore: save bot database before cycle restart [skip ci]" || true
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

          gh workflow run "bot.yml" --ref "${GITHUB_REF_NAME}" || true
